services:
  runner:
    build: ./runner
    image: kata-runner:latest
    environment:
      PGHOST: postgres
      PGUSER: kata
      PGPASSWORD: kata
    networks:
      - grading
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kata
      POSTGRES_PASSWORD: kata
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kata"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - grading

# internal: no route out, so grading cannot depend on the network.
networks:
  grading:
    internal: true
